# Tempatkan log_format di dalam blok http {}.
log_format peta_privacy '$request_method $uri $status';

# Tempatkan arahan berikut di dalam blok server {} situs.
access_log /var/log/nginx/peta-bantuan-access.log peta_privacy;

location ~* \.(css|js)$ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Jangan menambahkan $remote_addr, $request, atau $args ke log format.
# Gunakan retensi log terbatas sesuai kebijakan operasional.
